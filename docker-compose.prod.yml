services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_api_prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blog_network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: blog_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - blog_network

volumes:
  postgres_prod_data:

networks:
  blog_network:
    driver: bridge
